[tox]
env_list = py312, py313, py314, py312-server, py313-server, py314-server, package

[testenv]
package = wheel
change_dir = {env_tmp_dir}
commands =
    python -W error::DeprecationWarning -m unittest discover -s {tox_root}/test -p "*_test.py"
    python -m tinman --help

[testenv:py312-server]
extras = server
commands =
    {[testenv]commands}
    python -m tinman server --help

[testenv:py313-server]
extras = server
commands =
    {[testenv]commands}
    python -m tinman server --help

[testenv:py314-server]
extras = server
commands =
    {[testenv]commands}
    python -m tinman server --help

[testenv:package]
skip_install = true
deps = build>=1.2
commands = python {tox_root}/scripts/check_artifacts.py
