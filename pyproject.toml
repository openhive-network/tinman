[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinman"
dynamic = ["version"]
description = "Command-line tools for constructing and operating Hive testnets."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Open Hive" },
]
dependencies = [
  "ijson>=3.4,<4",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
server = [
  "Flask>=3.1,<4",
  "WTForms>=3.2,<4",
]
dev = [
  "build>=1.2",
  "tox>=4.30",
]

[project.scripts]
tinman = "tinman.main:sys_main"

[project.urls]
Repository = "https://gitlab.syncad.com/hive/tinman"

[tool.setuptools.dynamic]
version = { attr = "tinman.__version__" }

[tool.setuptools.packages.find]
include = ["tinman*", "simple_hive_client*"]

[tool.setuptools.package-data]
tinman = ["templates/*.html", "static/*.css"]
